version: 2

models:
  - name: dim_patients
    description: "One row per patient (Type 1 current state), enriched with chronic condition flags and COVID status."
    columns:
      - name: patient_key
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - unique
          - not_null

  - name: dim_providers
    description: "One row per healthcare provider."
    columns:
      - name: provider_key
        tests:
          - unique
          - not_null
      - name: provider_id
        tests:
          - unique
          - not_null

  - name: dim_organizations
    description: "One row per healthcare organization/facility."
    columns:
      - name: organization_key
        tests:
          - unique
          - not_null
      - name: organization_id
        tests:
          - unique
          - not_null

  - name: dim_payers
    description: "One row per insurance payer."
    columns:
      - name: payer_key
        tests:
          - unique
          - not_null
      - name: payer_id
        tests:
          - unique
          - not_null

  - name: fact_encounters
    description: "One row per encounter, the central fact table. Enriched with dimension surrogate keys, vitals, and a COVID flag."
    columns:
      - name: encounter_id
        tests:
          - unique
          - not_null
      - name: patient_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_patients')
              field: patient_key
      - name: provider_key
        tests:
          - relationships:
              to: ref('dim_providers')
              field: provider_key
      - name: organization_key
        tests:
          - relationships:
              to: ref('dim_organizations')
              field: organization_key
      - name: payer_key
        tests:
          - relationships:
              to: ref('dim_payers')
              field: payer_key

  - name: fact_covid_hospitalizations
    description: "One row per inpatient encounter for a COVID-flagged patient."
    columns:
      - name: encounter_id
        tests:
          - unique
          - not_null
      - name: patient_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_patients')
              field: patient_key
      - name: covid_status
        tests:
          - accepted_values:
              values: ['confirmed', 'suspected']